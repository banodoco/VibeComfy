name: Plan 55 LS-12 emission proof

on:
  pull_request:
    branches: [release/14/plan-55]

permissions:
  contents: read

concurrency:
  group: plan55-ls12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emission:
    if: github.head_ref == 'p55/ls-12'
    name: LS-12 ${{ matrix.os }} ${{ matrix.source }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        source: [base, candidate]
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'base' && 'd8e61a507f7eb0c133db9d39a41bc429cb12f54b' || github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        if: matrix.source == 'base'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proof-source
      - name: Copy the identical new probes to the unchanged base
        if: matrix.source == 'base'
        run: |
          cp proof-source/tests/test_ls12_emission_snapshot.py tests/
          cp proof-source/tests/test_ls12_generation_bytes.py tests/
          cp proof-source/tests/test_ls12_generation_witness.py tests/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the same test dependencies
        id: install
        run: python -m pip install -e '.[dev,png]'
      - name: Record source and environment
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/source.txt
          git rev-parse 'HEAD^{tree}' >> proof/source.txt
          python -VV >> proof/source.txt
          python -m pip freeze > proof/dependencies.txt
          sha256sum tests/test_ls12_emission_snapshot.py tests/test_ls12_generation_bytes.py tests/test_ls12_generation_witness.py > proof/probe-sha256.txt
      - name: Snapshot coherence and content-pass probes
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pytest -n 0 -q -rA tests/test_ls12_emission_snapshot.py tests/test_ls12_generation_bytes.py tests/test_ls12_generation_witness.py \
            --junitxml=proof/ls12.xml 2>&1 | tee proof/ls12.log
      - name: Existing object-info freshness and identity tests
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pytest -n 0 -q -rA tests/test_porting_object_info.py \
            tests/test_r13_object_info_contract.py tests/test_b14_object_info_publication.py \
            tests/test_object_info_schema.py \
            --junitxml=proof/object-info.xml 2>&1 | tee proof/object-info.log
      - name: Existing canonical bundle tests including inherited failures
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pytest -n 0 -q -rA tests/test_workflow_bundle.py \
            --junitxml=proof/bundle.xml 2>&1 | tee proof/bundle.log
      - name: Existing emitter and approval regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pytest -n 0 -q -rA tests/test_porting_emitter.py \
            tests/test_porting_emitter_widgets.py tests/test_porting_emit_signatures.py \
            tests/test_emitter_object_info_validation.py tests/test_runtime_execution.py \
            tests/test_compile_invariance.py \
            --junitxml=proof/emitter.xml 2>&1 | tee proof/emitter.log
      - name: Retain exact-head proof including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan55-ls12-vibe-${{ matrix.os }}-${{ matrix.source }}-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
