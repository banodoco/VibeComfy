# Maintained CI suite.
#
# Runs on pushes to main, release/*/main and megaplan/production-parity-templates, and on every pull_request.
#
# Steps:
#   1. Checkout (fetch-depth: 2 so PR diffs see the merge base if needed).
#   2. Install uv.
#   3. Install the package plus the pinned AppMana ComfyUI optional dependency
#      used by the oracle converter.
#   4. Run `make ci`, the shared local/GitHub contract for root hygiene, the
#      bounded fast Python tier, browser smoke, snapshot freshness, and the
#      Comfy oracle gate. The repository-wide Python tier is explicit and
#      separate (`make broad-pytest`).
#   5. Upload coverage.xml as a workflow artifact.
#
# Branch protection on `main` requires repo-admin action and is tracked as a
# user_action; this workflow only exposes the `test` status check.

name: ci

on:
  # Pushes run only on main, release mains and the megaplan branch that strict-ready.yml also lists.
  push:
    branches: [main, "release/*/main", "megaplan/production-parity-templates"]
  # Pull requests run for every base branch.
  pull_request: {}

# A newer run of the same pull request or branch supersedes an older one. main and release mains keep every commit's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

jobs:
  workflow-bundle-imports:
    name: workflow bundle imports (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bundle-reader test dependencies
        run: python -m pip install -e ".[dev]" numpy pillow

      - name: Prove bundle reads avoid the node library
        run: >-
          python -m pytest -q -rA --tb=short
          tests/test_workflow_bundle_imports.py
          tests/test_workflow_bundle.py::test_presentation_graph_door_returns_detached_records
          tests/test_workflow_bundle.py::test_rewriting_existing_pair_preserves_authored_presentation
          tests/test_workflow_bundle.py::test_v2_annotations_bind_scope_and_owner_and_materialize_content
          tests/test_workflow_bundle.py::test_presentation_collision_remint_keeps_semantic_link_endpoints

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv venv --python 3.11 --seed
          make PYTHON=.venv/bin/python install-ci

      - name: Enforce IR boundary
        run: PYTHONPATH=. .venv/bin/python scripts/check_ir_boundary.py

      - name: Run maintained fast repo gate
        # Makefile is the local/GitHub contract for repo hygiene, the bounded
        # fast Python tier, browser smoke, snapshot freshness, the Comfy
        # oracle, and the IR boundary checker.
        run: make PYTHON=.venv/bin/python ci

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  browser-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install VibeComfy and ComfyUI
        run: |
          uv venv --python 3.11 --seed
          make PYTHON=.venv/bin/python install-ci

      - name: Install Chromium test runtime
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove the extension boots in a real browser
        env:
          VIBECOMFY_DEMO_PICKER: "1"
          PYBIN: ${{ github.workspace }}/.venv/bin/python
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          node tests/e2e/run.mjs --no-seed -- \
            --config tests/e2e/playwright.config.mjs \
            tests/e2e/specs/extension_boot.spec.mjs

  # A pull request into a release branch comes from a branch of that release and names what it belongs
  # to: the plan (a plan branch does so by its name) or the astrid-dev issue. See the Release skill,
  # "How a release runs".
  landing-reference:
    name: landing reference
    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from a branch of this release and names its plan or issue
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          release="${BASE_REF#release/}"; release="${release%/main}"
          if ! printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/[a-z0-9][a-z0-9-]*$" || [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "::error::A pull request into ${BASE_REF} must come from a branch of that release: release/${release}/plan-<PP> or release/${release}/<topic>. This one comes from '${HEAD_REF}'."
            exit 1
          fi
          if printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/plan-[0-9]+$"; then
            echo "Plan branch: $HEAD_REF"; exit 0
          fi
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq '(plan[ -]?[0-9]+|astrid-dev#[0-9]+|astrid-dev/issues/[0-9]+)'; then
            echo "Reference found."; exit 0
          fi
          echo "::error::A pull request into a release branch must name the plan or the astrid-dev issue it belongs to, for example 'Plan 55' or 'banodoco/astrid-dev#721'."
          exit 1
