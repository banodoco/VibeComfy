name: Plan 55 prepared workflow proof

on:
  pull_request:
    branches: [release/14/plan-55]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepared:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p55/ls-4'
    name: LS-4 ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'baseline' && 'e5596dcd5ee1b9657acca4c90913c0da7631764a' || github.event.pull_request.head.sha || github.sha }}
      - name: Obtain the new full-bundle probes for the unchanged base
        if: matrix.source == 'baseline'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-source
      - name: Install only the new comparison probes on the base
        if: matrix.source == 'baseline'
        run: |
          cp proof-source/tests/test_prepared_default_target_compile.py tests/
          cp proof-source/tests/fixtures/prepared_default_target_inventory.json tests/fixtures/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the same test dependencies on both sides
        id: install
        run: python -m pip install -e '.[dev,png]'
      - name: Record exact source and environment
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/source.txt
          git rev-parse 'HEAD^{tree}' >> proof/source.txt
          python -VV >> proof/source.txt
          uname -a >> proof/source.txt
          python -m pip freeze > proof/dependencies.txt
          sha256sum tests/test_prepared_default_target_compile.py \
            tests/fixtures/prepared_default_target_inventory.json > proof/target-probe-sha256.txt
      - name: Unchanged compiler and queue regressions
        run: |
          python -m pytest -q \
            tests/test_runtime_execution.py tests/test_workflow_bundle.py \
            tests/test_runtime_run.py tests/test_runtime_session_validation.py \
            tests/test_runtime_session_embedded.py tests/test_runtime_session_server.py \
            tests/test_runtime_session_run_untracked.py \
            tests/test_compile_invariance.py tests/test_edge_primitives.py \
            tests/test_rc_primitive_widget_alias.py \
            --junitxml=proof/regressions.xml 2>&1 | tee proof/regressions.log
      - name: All defaults and prepared authority
        if: always() && matrix.source == 'candidate' && steps.install.outcome == 'success'
        run: |
          python -m pytest -q \
            tests/test_prepared_workflow.py tests/test_prepared_queue_fence.py \
            tests/test_prepared_schema_parity.py \
            tests/test_prepared_default_workflows.py \
            --junitxml=proof/prepared.xml 2>&1 | tee proof/prepared.log
      - name: Unchanged schema rules and target authority
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pytest -q tests/test_schema_validate.py tests/test_schema_target_authority.py \
            --junitxml=proof/schema-regressions.xml 2>&1 | tee proof/schema-regressions.log
      - name: Record the schema-parity probe bytes
        if: always() && matrix.source == 'candidate' && steps.install.outcome == 'success'
        run: sha256sum tests/test_prepared_schema_parity.py > proof/schema-probe-sha256.txt
      - name: Real target bundle compilation on both exact sources
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pytest -q tests/test_prepared_default_target_compile.py \
            -k test_default_full_bundle_compile \
            --junitxml=proof/target-full.xml 2>&1 | tee proof/target-full.log
      - name: Per-default prepared equality or identical full-compiler refusal
        if: always() && matrix.source == 'candidate' && steps.install.outcome == 'success'
        run: |
          python -m pytest -q tests/test_prepared_default_target_compile.py \
            -k test_default_matches_real_bundle_compile_with_selected_target \
            --junitxml=proof/target-prepared.xml 2>&1 | tee proof/target-prepared.log
      - name: Retain exact-head proof including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan55-ls4-vibe-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: error
          retention-days: 30

  schema-parity-before:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p55/ls-4'
    name: LS-4 schema parity on reviewed 4f6ba9f5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f6ba9f5508198be0f672f11bedb49e5f7cd51e7
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed source and identical new parity probes
        run: |
          python -m pip install -e '.[dev,png]'
          cp proof-source/tests/test_prepared_schema_parity.py tests/
          mkdir -p proof
          git rev-parse HEAD > proof/source.txt
          git rev-parse 'HEAD^{tree}' >> proof/source.txt
          python -VV >> proof/source.txt
          python -m pip freeze > proof/dependencies.txt
          sha256sum tests/test_prepared_schema_parity.py > proof/schema-probe-sha256.txt
      - name: Retain exact reviewed-source schema and prefix failures
        run: |
          set +e
          python -m pytest -q tests/test_prepared_schema_parity.py \
            --junitxml=proof/schema-parity-before.xml > proof/schema-parity-before.log 2>&1
          result=$?
          set -e
          cat proof/schema-parity-before.log
          test "$result" = 1
          python - <<'PY'
          from xml.etree import ElementTree as ET
          cases = list(ET.parse('proof/schema-parity-before.xml').iter('testcase'))
          values = ['below-minimum', 'above-maximum', 'undeclared-choice', 'range-and-choice-order']
          failed = {
              *(f'test_admission_refuses_same_schema_error_as_full_compile[{value}]' for value in values),
              *(f'test_cached_admission_rechecks_new_values_against_full_compile[{value}]' for value in values),
              *(f'test_cached_values_refuse_same_schema_error_without_reentering_compiler[{entry}-{value}]'
                for entry in ['accepts', 'fill'] for value in values),
              'test_admission_wraps_public_input_compile_error_exactly_like_full_compile',
              'test_prepared_only_prefix_bounds_choose_full_path[colon]',
              'test_prepared_only_prefix_bounds_choose_full_path[long-component]',
              'test_compiler_identity_distinguishes_dirty_source_at_the_same_commit',
              'test_dynamic_count_controller_keeps_full_preparation',
              'test_observed_dynamic_choice_controller_keeps_full_preparation',
          }
          assert len(cases) == 24 and len(failed) == 22
          assert {case.get('name') for case in cases if case.find('failure') is not None} == failed
          assert all(case.find('error') is None and case.find('skipped') is None for case in cases)
          assert all(case.get('name').startswith('test_cached_constraints_preserve_inclusive_boundaries_and_approved_bytes[')
                     for case in cases if case.find('failure') is None)
          PY
      - name: Retain reviewed-source parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan55-ls4-vibe-schema-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: error
          retention-days: 30

  refused-defaults-before:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p55/ls-4'
    name: LS-4 refusal parity before admission fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e13e94c5433df168d60b6deed69f9a1c3d58675e
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pre-fix source and the same strict target probes
        run: |
          python -m pip install -e '.[dev,png]'
          cp proof-source/tests/test_prepared_default_target_compile.py tests/
          cp proof-source/tests/fixtures/prepared_default_target_inventory.json tests/fixtures/
          mkdir -p proof
          git rev-parse HEAD > proof/source.txt
          git rev-parse 'HEAD^{tree}' >> proof/source.txt
          python -VV >> proof/source.txt
          python -m pip freeze > proof/dependencies.txt
          sha256sum tests/test_prepared_default_target_compile.py \
            tests/fixtures/prepared_default_target_inventory.json > proof/target-probe-sha256.txt
      - name: Retain the five defaults admitted despite full-compiler refusal
        run: |
          set +e
          python -m pytest -q tests/test_prepared_default_target_compile.py \
            -k test_default_matches_real_bundle_compile_with_selected_target \
            --junitxml=proof/refusals.xml > proof/refusals.log 2>&1
          result=$?
          set -e
          cat proof/refusals.log
          test "$result" = 1
          python - <<'PY'
          from xml.etree import ElementTree as ET
          cases = list(ET.parse('proof/refusals.xml').iter('testcase'))
          refused = {
              'edit/qwen_image_edit', 'image/qwen_image_2512', 'video/ltx2_3_i2v',
              'video/ltx2_3_runexx_first_last_frame', 'video/ltx2_3_t2v',
          }
          assert len(cases) == 13
          failed = set()
          for case in cases:
              assert case.find('error') is None and case.find('skipped') is None
              failure = case.find('failure')
              if failure is not None:
                  failed.add(case.get('name').split('[', 1)[1][:-1])
                  assert 'DID NOT RAISE' in failure.get('message', ''), case.attrib
          assert failed == refused, failed
          PY
      - name: Retain pre-fix refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan55-ls4-vibe-refusals-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: error
          retention-days: 30

  reviewed-attacks:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p55/ls-4'
    name: LS-4 attacks on reviewed a7f9dc2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a7f9dc2e4a5284bfe4b7078d8a27a7145b3e7933
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged reviewed source and new attack probes
        run: |
          python -m pip install -e '.[dev,png]'
          cp proof-source/tests/test_prepared_queue_fence.py tests/
          mkdir -p proof
          git rev-parse HEAD > proof/source.txt
          git rev-parse 'HEAD^{tree}' >> proof/source.txt
          python -VV >> proof/source.txt
          python -m pip freeze > proof/dependencies.txt
          sha256sum tests/test_prepared_queue_fence.py > proof/attack-probe-sha256.txt
      - name: Retain the eight attacks accepted by the reviewed source
        run: |
          set +e
          python -m pytest -q tests/test_prepared_queue_fence.py \
            --junitxml=proof/attacks.xml > proof/attacks.log 2>&1
          result=$?
          set -e
          cat proof/attacks.log
          test "$result" = 1
          python - <<'PY'
          from xml.etree import ElementTree as ET
          cases = list(ET.parse('proof/attacks.xml').iter('testcase'))
          assert len(cases) == 8
          for case in cases:
              failure = case.find('failure')
              assert failure is not None, case.attrib
              assert 'DID NOT RAISE' in failure.get('message', ''), case.attrib
              assert case.find('error') is None and case.find('skipped') is None
          PY
      - name: Retain reviewed-source attack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan55-ls4-vibe-reviewed-attacks-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: error
          retention-days: 30
